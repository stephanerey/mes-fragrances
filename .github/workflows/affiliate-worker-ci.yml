name: Affiliate Worker CI

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  affiliate-worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: affiliate_worker_test
          POSTGRES_USER: affiliate_worker
          POSTGRES_PASSWORD: affiliate_worker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U affiliate_worker -d affiliate_worker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AFFILIATE_TEST_DATABASE_URL: postgresql://affiliate_worker:affiliate_worker@127.0.0.1:5432/affiliate_worker_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install worker dependencies
        working-directory: affiliate-worker
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        working-directory: affiliate-worker
        run: pytest

      - name: Run lint
        working-directory: affiliate-worker
        run: ruff check .

      - name: Build Docker image
        run: docker build -t mes-fragrances-affiliate-worker ./affiliate-worker
